services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_media_ingestion_bot
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:8088"
    networks:
      - media_net
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      SESSION_FILE: /app/data/telethon.session
      SQLITE_PATH: /app/data/media_data.db
      MOVIES_DIR: ${MOVIES_DIR:-/media/movies}
      SHOWS_DIR: ${SHOWS_DIR:-/media/shows}
      TELETHON_SOURCE_CHAT: ${TELETHON_SOURCE_CHAT:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      WEB_PORT: 8088
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${MOVIES_DIR:-/media/movies}:${MOVIES_DIR:-/media/movies}
      - ${SHOWS_DIR:-/media/shows}:${SHOWS_DIR:-/media/shows}
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env

networks:
  media_net:
    name: ${DOCKER_NETWORK:-teldownloader_net}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
